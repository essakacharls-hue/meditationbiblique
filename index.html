<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141C55"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* ----- enseignements ----- */
.ens-hero{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--gold-soft),var(--surface));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:14px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font:inherit}
.tcard:hover{border-color:var(--accent);border-left-color:var(--gold)}
.tcard .ic{width:15px;height:15px;vertical-align:-2px;margin-right:5px}
.tdate{font-size:.78rem;color:var(--muted);font-weight:600}
.ttl{font-size:1.08rem;font-weight:800;color:var(--ink)}
.tref{font-size:.88rem;color:var(--accent);font-weight:600}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;font-size:.75rem;color:var(--muted)}
.tmeta .tag{border-radius:999px;padding:1px 8px;font-weight:700}
.tag.gui{background:var(--gold-soft);color:var(--at)}.tag.lib{background:var(--nt-soft);color:var(--nt)}
.tby{font-size:.72rem;color:var(--muted)}
.empty-t{text-align:center;padding:28px 18px}.empty-t .big .ic{width:42px;height:42px;color:var(--gold)}
.tbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;position:sticky;top:6px;z-index:5;background:var(--bg);padding:6px 0}
.tedit{display:grid;gap:12px}
.tf{display:grid;gap:6px}
.tfh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tfh label{font-weight:700;font-size:.85rem;color:var(--muted)}
.tf textarea{width:100%;font:inherit;line-height:1.5;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}
.tf textarea:focus{outline:2px solid var(--accent);background:var(--surface)}
.btn.mic{border-color:var(--accent);color:var(--accent)}
.btn.mic.on{background:#D13A3A;border-color:#D13A3A;color:#fff;animation:micp 1.2s infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(209,58,58,.5)}50%{box-shadow:0 0 0 7px rgba(209,58,58,0)}}
.interim{font-size:.82rem;color:#D13A3A;font-style:italic}
.tpoint{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.tph{display:flex;align-items:center;gap:8px}
.pnum{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:.85rem}
.add-pt{justify-self:start;border-style:dashed}
.tfil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tcard.is-pub{border-left-color:var(--ok)}
.pub,.draft,.pubmod{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700}
.pub{background:var(--ok-soft);color:var(--ok)}.draft{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.pubmod{background:var(--gold-soft);color:var(--at);font-weight:600}
.pub .ic,.draft .ic{width:13px;height:13px;margin:0}
.tcard .pub{display:block;line-height:1.35;border-radius:10px;padding:4px 10px}.tcard .pub .ic{vertical-align:-2px;margin-right:4px}
.pubban{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px dashed var(--gold);background:var(--gold-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pubban.on{border:1px solid var(--ok);background:var(--ok-soft)}
.pbi{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#fff;flex:0 0 auto}.pubban.on .pbi{background:var(--ok)}
.pbi .ic{width:20px;height:20px}
.pbt{display:grid;gap:2px;flex:1 1 200px}.pbt b{font-size:1rem}.pbt>span{font-size:.85rem;color:var(--muted)}.pubban.on .pbt b{color:var(--ok)}
.tbk2{display:none}@media (max-width:720px){.tbk2{display:inline}}
.ens-hero .row{flex-wrap:wrap}
.tedit + .card label.btn{white-space:normal;text-align:left;height:auto}
@media (max-width:720px){.ens-hero .row{flex:1 1 100% !important}.ens-hero .row>*{flex:1 1 auto;justify-content:center}nav.tabs button{font-size:.56rem;letter-spacing:-.03em}nav.tabs .ts{text-overflow:clip!important}.tbar .tback{display:none}.tbar{flex-wrap:nowrap}}

/* ----- écran de mot de passe ----- */
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(circle at 50% 18%,rgba(242,184,58,.35),rgba(242,184,58,0) 38%),linear-gradient(160deg,#0E1440,#141C55 45%,#2D40B8)}
body.locked{overflow:hidden}
.gate-card{width:100%;max-width:360px;text-align:center;color:#fff}
.gate-logo{width:76px;height:76px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);box-shadow:0 0 40px rgba(242,184,58,.45)}
.gate-logo .ic{width:42px;height:42px;color:#F2B83A}
.gate h1{margin:0;font-size:1.9rem;letter-spacing:.01em}
.gate-sub{margin:2px 0 22px;color:rgba(255,255,255,.7)}
.gate form{display:grid;gap:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:20px;backdrop-filter:blur(6px);text-align:left}
.gate-txt{margin:0;color:rgba(255,255,255,.88);font-size:.92rem;line-height:1.45}
.gate-f{display:grid;gap:6px;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.75)}
.gate-in{position:relative;display:block}
.gate-in input{width:100%;box-sizing:border-box;font:inherit;font-size:1.05rem;padding:12px 44px 12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.95);color:#141C55}
.gate-in input:focus{outline:3px solid #F2B83A}
.gate-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px;cursor:pointer;color:#55608A}
.gate-eye .ic{width:20px;height:20px}
.gate-btn{display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;font-size:1rem;padding:13px;border:0;border-radius:12px;cursor:pointer;color:#2A1C00;background:linear-gradient(135deg,#F7CB62,#E2A21E);box-shadow:0 6px 18px rgba(226,162,30,.35)}
.gate-btn .ic{width:18px;height:18px}
.gate-msg{margin:0;min-height:1.2em;color:#FFB4B4;font-size:.88rem;font-weight:600}
.gate-hint{margin:0;color:rgba(255,255,255,.6);font-size:.78rem}
.gate-link{border:0;background:none;color:#FFE28A;font:inherit;font-size:.88rem;text-decoration:underline;cursor:pointer;justify-self:center}
.pwdform{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
#pwdbox b .ic{width:17px;height:17px;vertical-align:-3px;margin-right:6px}

.errcard{border:1px solid #E5484D;background:linear-gradient(135deg,#FFF1F1,var(--surface));margin-bottom:14px}
.errcard .eh{font-size:1.05rem;color:#B42318;margin-bottom:4px}.errcard p{margin:6px 0}.errcard .edet{font-size:.85rem;color:var(--muted);word-break:break-word}
.errcard details{margin:6px 0 10px;font-size:.9rem}.errcard summary{cursor:pointer;font-weight:700;color:var(--accent)}
.warncard{border:1px solid var(--gold);background:var(--gold-soft);margin-bottom:14px}.warncard p{margin:6px 0 0;font-size:.9rem}
.sync .dot{display:none!important}

#dispbox{display:grid;gap:12px}#dispbox>b .ic{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
.dsrow{display:flex;align-items:center;gap:10px;margin-top:6px}.dsrow input{flex:1;accent-color:var(--accent)}
.dschips{display:flex;flex-wrap:wrap;gap:8px}
.dsprev{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.dsv{margin:0 0 4px;font-style:italic;font-size:1.05rem;color:var(--accent)}
#dbz{accent-color:var(--gold)}
</style>
<title>Programme de Méditation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : carnet de méditation — en-tête avec progression, onglets collants, une colonne lisible (max 900px) ; la séance du jour en carte principale, le programme en liste filtrable qui passe en lignes empilées sur téléphone */
:root{
  --bg:#EEF1FA; --surface:#FFFFFF; --ink:#16222A; --muted:#56656D; --line:#D9E1DF;
  --accent:#141C55; --accent-soft:#E0EFEC; --on-accent:#FFFFFF;
  --at:#8A5800; --at-soft:#F6EBD6; --nt:#3A4D9E; --nt-soft:#E5E8F6;
  --ok:#1C7A3B; --ok-soft:#E1F3E6; --warn:#9A4A00; --danger:#B42318;
  --font:'Sansation','Exo 2',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1315; --surface:#152024; --ink:#E3ECEA; --muted:#93A4A7; --line:#25343A;
  --accent:#4DC0B4; --accent-soft:#10302C; --on-accent:#06201D;
  --at:#E3B15E; --at-soft:#2C220F; --nt:#93A5F2; --nt-soft:#1A2140;
  --ok:#5BD58A; --ok-soft:#10291A; --warn:#F2B35B; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1315; --surface:#152024; --ink:#E3ECEA; --muted:#93A4A7; --line:#25343A;
  --accent:#4DC0B4; --accent-soft:#10302C; --on-accent:#06201D;
  --at:#E3B15E; --at-soft:#2C220F; --nt:#93A5F2; --nt-soft:#1A2140;
  --ok:#5BD58A; --ok-soft:#10291A; --warn:#F2B35B; --danger:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand svg{width:40px;height:40px;flex:none}
h1{font-size:1.4rem;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.sync{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);white-space:nowrap}
.sync.on{color:var(--ok);border-color:var(--ok)}
.topbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.topbar i{display:block;height:100%;background:var(--accent)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{font:inherit;font-weight:600;font-size:.9rem;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.85rem;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:3px 8px;font-size:.75rem}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:6px;font-size:.85rem}
.icon:hover{color:var(--ink);background:var(--bg)}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
label.f{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row>*{flex:1 1 150px;min-width:0}
.row>.btn{flex:0 0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;min-width:0}
h2.sec{font-size:1.05rem;font-weight:800;margin:22px 0 10px}
.muted{color:var(--muted);font-size:.85rem}
.chip{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.chip.at{background:var(--at-soft);color:var(--at)}
.chip.nt{background:var(--nt-soft);color:var(--nt)}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.src{text-transform:none;letter-spacing:0;font-weight:600}
/* séance */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;min-width:0}
.sess.isdone{border-color:var(--ok)}
.sess-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px 0}
.sess-h .no{font-size:.78rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.sess-b{padding:6px 16px 16px;display:grid;gap:12px}
.ref{font-size:1.45rem;font-weight:800;margin:0;text-wrap:balance}
.theme{font-size:1.02rem;margin:0;font-weight:600;color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.82rem}
.meta span{border:1px solid var(--line);border-radius:8px;padding:3px 9px;background:var(--bg)}
.meta .key{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.subj h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
ol.sl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px}
ol.sl li{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:start;padding:8px 10px}
ol.sl li+li{border-top:1px dashed var(--line)}
ol.sl li .n{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;min-width:1.4em;text-align:right}
ol.sl li .tx{min-width:0;overflow-wrap:anywhere}
ol.sl li.pr .tx{color:var(--muted)}
ol.sl li input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
ol.sl li .acts{display:flex;gap:0;flex-wrap:nowrap}
ol.sl li.ed{grid-template-columns:1fr}
.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;font-size:.88rem}
.ai{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px;display:grid;gap:8px}
.ai label{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:.9rem}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.foot .row{flex:1 1 260px}
details.steps{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
details.steps summary{cursor:pointer;font-weight:700}
details.steps ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:.9rem}
/* résumé */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.summary div{background:var(--surface);padding:10px 12px;min-width:0}
.summary b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.summary span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
@media (max-width:560px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pace{font-size:.88rem;padding:8px 12px;border-radius:8px;margin-bottom:14px;background:var(--surface);border:1px solid var(--line)}
.pace b{color:var(--accent)}
/* programme */
.plist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{display:grid;grid-template-columns:4.2em minmax(0,13em) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--bg)}
.prow .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;font-weight:700}
.prow .pref{font-weight:700;min-width:0;overflow-wrap:anywhere}
.prow .pth{min-width:0;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.prow .pst{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prow.done .pref{color:var(--ok)}
@media (max-width:620px){.prow{grid-template-columns:3.4em minmax(0,1fr) auto}.prow .pth{grid-column:2/4}}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;font-size:.85rem;font-variant-numeric:tabular-nums}
/* overlay */
.ovl{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);z-index:30;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
.ovl .inner{max-width:860px;margin:0 auto}
.ovl .bar{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
/* import / export */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;background:var(--surface);display:grid;gap:8px;justify-items:center}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.tblwrap{overflow:auto;max-height:360px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:10px}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 8px;border-top:1px solid var(--line);vertical-align:top}
table.t td.c{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.exgrid .card{display:grid;gap:10px;align-content:start;margin:0}
.exgrid h3{margin:0;font-size:1rem}
/* progression */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 18px}
.bk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:.82rem;padding:4px 0}
.bk .bar{grid-column:1/-1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bk .bar i{display:block;height:100%;background:var(--accent)}
.bk.nt .bar i{background:var(--nt)}
.bk .v{color:var(--muted);font-variant-numeric:tabular-nums}
.hist li{font-size:.88rem}
.pingate{position:fixed;inset:0;z-index:60;background:var(--bg);padding:16px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:40;max-width:calc(100% - 32px)}
.warnbox{border:1px solid var(--warn);color:var(--warn);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:12px}
/* plans de lecture */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.pchip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pchip.add{border-style:dashed}
.chip.warn{background:var(--surface);color:var(--warn);border:1px solid var(--warn)}
.lph{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:flex-start}
.latebox{border-color:var(--warn)}
.rdlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rd{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:start}
.rd:last-child{border-bottom:0}
.rdlist.big .rd,.rd:not(:has(.rdd)){grid-template-columns:minmax(0,1fr)}
.rd.ok .rdt{color:var(--muted)}
.rdd{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;text-transform:capitalize}
.rdl{display:grid;gap:6px;min-width:0}
.rdi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;cursor:pointer}
.rdi input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.rdt{display:block;font-weight:600;overflow-wrap:anywhere}
.rdlist.big .rdt{font-size:1.15rem}
.rdm{display:block;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lab{display:inline-block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 7px;margin-right:4px;vertical-align:1px}
@media (max-width:520px){.rd{grid-template-columns:minmax(0,1fr)}}
/* texte biblique */
.btxt{display:grid;gap:8px}
.bth{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ptxt{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.phead,.vrow{display:grid;grid-template-columns:2.4em repeat(var(--n),minmax(0,1fr));gap:12px;padding:6px 10px}
.phead{background:var(--bg);border-bottom:1px solid var(--line);font-size:.85rem;align-items:center}
.vab{font-size:.72rem;font-weight:700;letter-spacing:.05em;color:var(--accent)}
.vrow+.vrow{border-top:1px solid var(--line)}
.vrow.hl{background:var(--accent-soft)}
.vrow.hl .vn{color:var(--accent)}
.vn{font-size:.75rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;padding-top:3px}
.vt{min-width:0;overflow-wrap:anywhere;font-size:.95rem;line-height:1.55}
.vtab{display:none;font-style:normal;font-size:.68rem;font-weight:700;color:var(--accent);margin-right:6px;letter-spacing:.05em}
@media (max-width:640px){.phead{display:none}.vrow{grid-template-columns:2em minmax(0,1fr);row-gap:4px}.vrow .vt{grid-column:2}.vtab{display:inline}}
.online{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem}
.online a{border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--accent);text-decoration:none;background:var(--surface)}
.online a:hover{border-color:var(--accent)}
.brow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.rdb{border:0;background:transparent;text-align:left;padding:0;cursor:pointer;font:inherit;color:inherit;min-width:0}
.rdb u{color:var(--accent)}
.vpick{border:0;background:transparent;font:inherit;font-size:.75rem;font-weight:700;color:var(--accent);cursor:pointer;text-decoration:underline dotted;padding:3px 0 0;text-align:left}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:.9rem}
.cmpl{display:grid;gap:10px}
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cmph{background:var(--accent-soft);color:var(--accent);font-weight:800;padding:6px 12px}
.cmpr{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.cmpr .vab{padding-top:3px}

/* ===== Design v2 : nuit et lampe (Psaume 119:105) ===== */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --ink:#18213F; --muted:#5A6484; --line:#DFE3EF;
  --accent:#3347C9; --accent-soft:#E7EAFB; --on-accent:#FFFFFF;
  --gold:#C98A0E; --gold-soft:#FCF1D8; --on-gold:#2A1C00;
  --at:#B5650A; --at-soft:#FCEEDB; --nt:#6E3CC0; --nt-soft:#F0E8FB;
  --ok:#148A55; --ok-soft:#DDF4E8; --warn:#C05800; --danger:#D13A3A;
  --hero1:#141C55; --hero2:#2D40B8; --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.72);
  --shadow:0 1px 2px rgba(24,33,90,.06),0 8px 24px rgba(24,33,90,.07);
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1020; --surface:#161B31; --ink:#E7EAF8; --muted:#9BA3C6; --line:#272E50;
  --accent:#8D9CFF; --accent-soft:#222A57; --on-accent:#0C1020;
  --gold:#F2B947; --gold-soft:#3A2D10; --on-gold:#1E1500;
  --at:#F2B25E; --at-soft:#38270F; --nt:#C4A0FF; --nt-soft:#2C1E48;
  --ok:#4CDB9C; --ok-soft:#10301F; --warn:#FFB45E; --danger:#FF8585;
  --hero1:#0B1140; --hero2:#2433A0; --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1020; --surface:#161B31; --ink:#E7EAF8; --muted:#9BA3C6; --line:#272E50;
  --accent:#8D9CFF; --accent-soft:#222A57; --on-accent:#0C1020;
  --gold:#F2B947; --gold-soft:#3A2D10; --on-gold:#1E1500;
  --at:#F2B25E; --at-soft:#38270F; --nt:#C4A0FF; --nt-soft:#2C1E48;
  --ok:#4CDB9C; --ok-soft:#10301F; --warn:#FFB45E; --danger:#FF8585;
  --hero1:#0B1140; --hero2:#2433A0; --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
body{background:var(--bg)}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.btn,.pchip,.icon{display:inline-flex;align-items:center;gap:6px;justify-content:center}
/* en-tête */
.hero{background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);color:var(--hero-ink);border-radius:22px;padding:18px 20px 16px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(242,185,71,.45),rgba(242,185,71,0) 70%);pointer-events:none}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero .brand{display:flex;gap:12px;align-items:center}
.hero .logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#F2B947}
.hero .logo .ic{width:28px;height:28px}
.hero h1{font-size:1.45rem;font-weight:800;margin:0;line-height:1.1;color:var(--hero-ink)}
.hero .sub2{font-size:.85rem;color:var(--hero-soft);letter-spacing:.02em}
.hero .verse{position:relative;z-index:1;margin:14px 0 12px;font-size:.95rem;font-style:italic;color:#FBE7B5;max-width:60ch;text-wrap:balance}
.hero .verse span{font-style:normal;font-size:.75rem;color:var(--hero-soft);margin-left:6px;white-space:nowrap}
.hero-prog{position:relative;z-index:1;display:grid;gap:6px}
.hero .topbar{height:8px;background:rgba(255,255,255,.18);border-radius:99px;margin:0}
.hero .topbar i{background:linear-gradient(90deg,#F2B947,#FFD98A);border-radius:99px}
.hero .sub{color:var(--hero-soft);font-size:.82rem}
.hero .hsync{margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.hero .hsync:empty{display:none}.hero .hsync .ic{width:15px;height:15px}.hero .hsync b{color:var(--hero-ink);font-weight:600}
.devt{width:100%;border-collapse:collapse;font-size:.85rem}.devt th,.devt td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}.devt th{color:var(--muted);font-weight:600}
.hero .sync{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:var(--hero-ink);display:inline-flex;gap:6px;align-items:center}
.hero .sync.on{color:#B9F5D6;border-color:rgba(185,245,214,.5)}
.sync{cursor:pointer}.sync .dot,.cst .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#9AA3B8;vertical-align:0}
.st-ok .dot{background:#3BE08A;box-shadow:0 0 0 3px rgba(59,224,138,.25)}.st-off .dot{background:#F2B83A}.st-err .dot{background:#FF6B6B;box-shadow:0 0 0 3px rgba(255,107,107,.25)}.st-busy .dot{background:#7FA7FF;animation:micp 1.2s infinite}
.hero .sync.st-err{color:#FFD0D0;border-color:rgba(255,107,107,.6)}.hero .sync.st-off{color:#FFE7B0;border-color:rgba(242,184,58,.6)}
/* onglets */
nav.tabs{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;gap:4px;box-shadow:var(--shadow);top:calc(env(safe-area-inset-top,0px) + 6px);margin-bottom:18px}
nav.tabs button{display:inline-flex;align-items:center;gap:7px;border-radius:11px;padding:9px 12px;color:var(--muted)}
nav.tabs button .ic{width:18px;height:18px}
nav.tabs button:hover{background:var(--bg);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
nav.tabs .ts{display:none}
@media (min-width:721px){nav.tabs{display:flex;flex-wrap:wrap;justify-content:center;overflow:visible}}
@media (min-width:721px){nav.tabs .tl{display:none}nav.tabs .ts{display:inline}nav.tabs button{padding:9px 10px}}
@media (max-width:720px){
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;margin:0;border-radius:18px 18px 0 0;border-bottom:0;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow:visible}
  nav.tabs button{flex-direction:column;gap:3px;padding:6px 0;font-size:.62rem;border-radius:10px;min-width:0}
  nav.tabs button .ic{width:21px;height:21px}
  nav.tabs .tl{display:none}
  nav.tabs .ts{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}
/* surfaces */
.card,.sess,.plist,.rdlist,.ptxt,.cmp,details.steps,.pace,.summary{border-radius:var(--r);box-shadow:var(--shadow);border-color:var(--line)}
.card{padding:18px}
h2.sec{display:flex;align-items:center;gap:8px;font-size:1.08rem}
h2.sec .ic{color:var(--accent)}
.btn{border-radius:11px;padding:8px 14px;transition:transform .08s ease,box-shadow .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--hero2));border:0;color:#fff;box-shadow:0 4px 12px rgba(51,71,201,.28)}
.btn.gold{background:linear-gradient(135deg,#F2B947,#E09A16);border:0;color:var(--on-gold);box-shadow:0 4px 12px rgba(224,154,22,.3);font-weight:800}
.btn.ok{background:var(--ok-soft)}
input[type=text],input[type=date],input[type=number],input[type=search],input[type=password],select,textarea{border-radius:11px;padding:9px 12px;background:var(--bg);border-color:var(--line)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
/* séance */
.sess{border:0;position:relative}
.sess::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:linear-gradient(90deg,var(--at),#F2B947)}
.sess.nt::before{background:linear-gradient(90deg,var(--nt),var(--accent))}
.sess.isdone::before{background:linear-gradient(90deg,var(--ok),#7BE3B0)}
.sess-h{padding:18px 18px 0}
.sess-b{padding:8px 18px 18px;gap:14px}
.ref{font-size:1.6rem;letter-spacing:-.01em}
.theme{font-size:1.06rem;color:var(--accent);display:flex;align-items:flex-start;gap:6px}
.meta span{border:0;background:var(--bg);border-radius:999px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center}
.meta .key{background:var(--gold-soft);color:var(--at)}
.chip{border-radius:999px;padding:3px 10px}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.subj h3,.bth{font-size:.78rem;color:var(--ink);display:flex;align-items:center;gap:8px}
.subj h3 .ic{color:var(--gold)} .bth .ic{color:var(--accent)}
ol.sl{border:0;display:grid;gap:8px}
ol.sl li{background:var(--bg);border-radius:12px;padding:10px 12px;border:1px solid transparent}
ol.sl li+li{border-top:1px solid transparent}
ol.sl li.pr{background:var(--ok-soft)}
ol.sl li.pr .tx{color:var(--ink);opacity:.75}
ol.sl li input[type=checkbox]{accent-color:var(--ok);width:20px;height:20px}
ol.sl li .n{color:var(--gold);font-weight:800}
.empty{border-radius:12px;background:var(--bg);border-style:dashed}
.ai{border-radius:12px}
.foot{border-top:1px dashed var(--line)}
details.steps{border:0;padding:14px 18px}
details.steps summary{display:flex;align-items:center;gap:8px;color:var(--accent)}
details.steps ol li::marker{color:var(--gold);font-weight:800}
.pace{border:0;background:linear-gradient(90deg,var(--gold-soft),var(--surface))}
.pace b{color:var(--at)}
/* listes */
.plist{border:0}
.prow{padding:12px 14px}
.prow .num{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 6px;text-align:center}
.prow.done .num{background:var(--ok-soft);color:var(--ok)}
.chip.at{background:var(--at-soft);color:var(--at)} .chip.nt{background:var(--nt-soft);color:var(--nt)}
.summary{border:0;gap:10px;background:transparent;box-shadow:none}
.summary div{border-radius:14px;box-shadow:var(--shadow);padding:14px}
.summary div:nth-child(1){background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.summary div:nth-child(2){background:linear-gradient(135deg,var(--gold-soft),var(--surface))}
.summary div:nth-child(3){background:linear-gradient(135deg,var(--nt-soft),var(--surface))}
.summary div:nth-child(4){background:linear-gradient(135deg,var(--ok-soft),var(--surface))}
.summary b{font-size:1.5rem;color:var(--ink)}
.bk .bar{height:7px;border-radius:99px}
.bk .bar i{background:linear-gradient(90deg,var(--at),#F2B947);border-radius:99px}
.bk.nt .bar i{background:linear-gradient(90deg,var(--nt),var(--accent))}
.pchip{border-radius:999px;padding:7px 14px}
.pchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.rd{padding:12px 14px}
.rd.ok{background:var(--ok-soft)}
.rdi input{accent-color:var(--ok);width:20px;height:20px}
.lab{background:var(--gold-soft);color:var(--at)}
.vrow.hl{background:var(--gold-soft)} .vrow.hl .vn{color:var(--at)}
.vab{color:var(--nt)}
.cmph{background:linear-gradient(90deg,var(--accent-soft),var(--surface));color:var(--accent)}
.online a{border-radius:999px}
.drop{border-radius:var(--r);background:var(--surface)}
.selbar{border-radius:12px;border:0;background:var(--gold-soft)}
.exgrid h3{display:flex;align-items:center;gap:8px}
.exgrid h3 .ic{color:var(--accent);width:22px;height:22px}
.toast{border-radius:12px;box-shadow:var(--shadow)}
.ovl .inner>.bar .btn{background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

,"Tout le passage",6,3,13,3,18],[0,38,"Malachie 4:1-6","Le soleil de justice ; Élie envoyé",6,"Tout le passage",6,4,1,4,6]],"SP":{"1":["Rendons grâce à Dieu parce qu'au commencement, il a tout créé par sa puissance (v. 1).","Adorons le Dieu éternel qui existait avant toutes choses et qui règne sur toute la création (v. 1).","Prions pour que l'Esprit de Dieu plane sur tout ce qui est informe et vide dans nos vies, nos familles et notre pays (v. 2).","Prions pour que Dieu dise « Que la lumière soit ! » sur chaque situation de ténèbres que nous traversons (v. 3).","Brisons toute puissance des ténèbres qui maintient nos foyers dans la confusion et le désordre, au nom de Jésus (v. 2-4).","Prions pour que Dieu sépare en nous la lumière des ténèbres et nous donne le discernement (v. 4).","Rendons grâce à Dieu parce que ce qu'il fait est bon (v. 4, 10, 12).","Prions pour que la Parole de Dieu crée l'ordre là où règne le chaos : dans nos finances, notre travail et nos projets (v. 6-10).","Prions pour que notre vie porte du fruit selon son espèce, comme la terre que Dieu a fait produire (v. 11-12).","Prions pour la grâce de croire que Dieu peut encore créer à partir de rien (v. 1-3)."],"2":["Rendons grâce à Dieu pour Jésus-Christ, fils de David et fils d'Abraham, en qui toutes les promesses s'accomplissent (v. 1).","Adorons le Dieu fidèle qui a gardé sa promesse de génération en génération (v. 17).","Rendons grâce à Dieu parce qu'il a inscrit dans la lignée du Messie des femmes comme Tamar, Rahab et Ruth : sa grâce restaure les histoires brisées (v. 3, 5).","Prions pour que nos familles fassent partie de la lignée de la bénédiction et de la foi (v. 1-2).","Prions pour que nos enfants et petits-enfants marchent dans la foi d'Abraham (v. 2).","Brisons toute malédiction générationnelle et tout héritage de péché sur nos lignées, par le sang de Jésus (v. 3-6).","Prions pour que Dieu transforme notre passé en témoignage de sa grâce (v. 5).","Demandons pardon pour les péchés de nos pères que nous avons répétés, et prions pour une nouvelle génération qui marche avec Dieu (v. 6).","Prions pour la grâce de laisser un héritage spirituel à ceux qui viendront après nous (v. 16-17).","Rendons grâce à Dieu parce que Jésus est appelé Christ, l'Oint qui sauve (v. 16)."],"3":["Rendons grâce à Dieu pour les astres qu'il a placés dans le ciel pour marquer les temps et les saisons (v. 14-18).","Prions pour que Dieu règle les temps et les saisons de notre vie selon sa volonté (v. 14).","Adorons le Créateur de toute vie dans les eaux, dans le ciel et sur la terre (v. 20-25).","Rendons grâce à Dieu parce qu'il nous a créés à son image et à sa ressemblance (v. 26-27).","Prions pour que l'image de Dieu soit restaurée en nous et en chaque membre de nos familles (v. 27).","Prions pour recevoir la bénédiction de Dieu : soyez féconds, multipliez, remplissez la terre (v. 28).","Prions pour que nous exercions la domination que Dieu nous a donnée sur notre environnement, nos finances et nos circonstances (v. 28).","Brisons toute stérilité dans nos vies, dans nos foyers, dans nos ministères et dans nos projets, au nom de Jésus (v. 28).","Rendons grâce à Dieu pour la nourriture qu'il pourvoit chaque jour (v. 29-30).","Prions pour que Dieu regarde nos vies et dise : « Cela est très bon » (v. 31)."],"4":["Rendons grâce à Dieu parce qu'il a achevé son œuvre (v. 1-2).","Prions pour la grâce d'achever les œuvres que Dieu nous a confiées (v. 2).","Prions pour que nous entrions dans le repos de Dieu et que nous sortions de l'agitation (v. 2).","Prions pour que Dieu bénisse et sanctifie notre temps de repos et de culte (v. 3).","Demandons pardon pour les fois où nous avons négligé le temps consacré à Dieu.","Brisons tout esprit d'épuisement, de surmenage et d'agitation dans nos vies, au nom de Jésus.","Prions pour que nos familles apprennent à se reposer en Dieu et à lui consacrer du temps.","Prions pour l'équilibre entre le travail et le repos selon la volonté de Dieu."],"5":["Rendons grâce à Dieu pour la naissance de Jésus, conçu du Saint-Esprit (v. 18, 20).","Adorons Emmanuel, Dieu avec nous (v. 23).","Rendons grâce à Dieu parce que Jésus sauve son peuple de ses péchés (v. 21).","Prions pour avoir la justice et la bonté de Joseph, qui ne voulait pas exposer Marie à la honte (v. 19).","Prions pour que Dieu nous parle dans nos moments de doute et d'inquiétude, comme il a parlé à Joseph (v. 20).","Prions pour la grâce de ne pas craindre quand Dieu nous conduit sur un chemin inattendu (v. 20).","Prions pour la grâce d'obéir sans tarder à la voix de Dieu, comme Joseph (v. 24).","Prions pour que Jésus soit vraiment « Dieu avec nous » dans nos maisons, notre travail et nos épreuves (v. 23).","Prions pour la protection et la pureté des fiancés et des couples de notre entourage (v. 18-19, 24-25).","Rendons grâce à Dieu parce que toutes ses promesses s'accomplissent (v. 22)."],"6":["Rendons grâce à Dieu parce qu'il a formé l'homme de la poussière et lui a donné le souffle de vie (v. 7).","Prions pour que le souffle de Dieu ranime tout ce qui est mort en nous (v. 7).","Rendons grâce à Dieu pour le jardin qu'il a préparé : il pourvoit à nos besoins avant même que nous les demandions (v. 8-9).","Prions pour que Dieu nous établisse à la place qu'il a choisie pour nous (v. 8, 15).","Prions pour la grâce de cultiver et de garder fidèlement ce que Dieu nous a confié : famille, travail et ministère (v. 15).","Prions pour la grâce d'obéir aux limites que Dieu a fixées (v. 16-17).","Brisons toute attirance pour ce que Dieu a interdit, au nom de Jésus (v. 17).","Prions pour que les fleuves de la bénédiction de Dieu arrosent nos vies (v. 10-14).","Prions pour avoir du discernement et choisir l'arbre de vie plutôt que la connaissance qui mène à la mort (v. 9, 17)."],"7":["Rendons grâce à Dieu pour l'institution du mariage (v. 18, 24).","Rendons grâce à Dieu parce qu'il voit notre solitude et y pourvoit (v. 18).","Prions pour les célibataires : que Dieu leur donne une aide qui leur soit semblable (v. 18).","Prions pour que chaque époux reçoive son épouse comme un don de Dieu (v. 22-23).","Prions pour que les couples quittent leur père et leur mère et s'attachent l'un à l'autre (v. 24).","Prions pour que les couples deviennent une seule chair dans l'unité, l'amour et la fidélité (v. 24).","Brisons toute ingérence et toute manipulation qui divisent les couples, au nom de Jésus (v. 24).","Prions pour la transparence et l'absence de honte entre époux (v. 25).","Prions pour la restauration des foyers en crise.","Prions pour notre propre foyer : que Dieu le bâtisse selon son dessein (v. 22)."],"8":["Adorons Jésus, le roi des Juifs, que même les nations sont venues adorer (v. 2).","Prions pour que nous cherchions Jésus avec la même persévérance que les mages (v. 1-2).","Prions pour que l'étoile de Dieu nous guide dans nos décisions (v. 9).","Brisons tout esprit d'Hérode : la jalousie, la ruse et la peur qui veulent détruire ce que Dieu fait naître (v. 3, 7-8).","Prions pour que tout plan caché contre nos vies et nos enfants soit déjoué (v. 8, 12).","Prions pour la joie de trouver Jésus (v. 10).","Prions pour la grâce de nous prosterner et d'offrir à Dieu le meilleur de nous-mêmes (v. 11).","Prions pour que Dieu nous avertisse en songe et nous fasse prendre un autre chemin quand le danger se présente (v. 12).","Prions pour que les nations viennent à la lumière de Christ.","Rendons grâce à Dieu parce que la Parole prophétique s'accomplit (v. 5-6)."],"9":["Prions pour être capables de reconnaître la voix rusée du serpent (v. 1).","Brisons toute voix qui met en doute la Parole de Dieu : « Dieu a-t-il réellement dit ? » (v. 1).","Prions pour que nous connaissions exactement la Parole de Dieu, sans rien y ajouter ni retrancher (v. 2-3).","Brisons le mensonge qui dit que le péché n'a pas de conséquences : « Vous ne mourrez point » (v. 4).","Demandons pardon pour les fois où nous avons convoité ce que Dieu a interdit (v. 6).","Prions pour la grâce de résister à la convoitise des yeux, à la convoitise de la chair et à l'orgueil de la vie (v. 6).","Prions pour que les époux s'aident mutuellement à résister à la tentation (v. 6).","Prions pour que Dieu couvre notre honte et notre nudité spirituelle (v. 7).","Brisons toute séduction qui cible nos foyers et nos enfants, au nom de Jésus."],"10":["Rendons grâce à Dieu parce qu'il cherche l'homme pécheur : « Où es-tu ? » (v. 9).","Prions pour que nous ne nous cachions pas de Dieu, mais que nous venions à lui avec nos fautes (v. 8-10).","Demandons pardon pour les fois où nous avons rejeté la faute sur les autres (v. 12-13).","Prions pour la grâce de reconnaître nos fautes sans accuser autrui.","Rendons grâce à Dieu pour la promesse du Sauveur : la postérité de la femme écrasera la tête du serpent (v. 15).","Brisons la tête du serpent sous nos pieds par la victoire de Jésus-Christ (v. 15).","Prions pour que Dieu nous revête de sa justice, comme il a revêtu Adam et Ève de tuniques de peau (v. 21).","Prions pour la grâce de supporter les conséquences de nos fautes avec humilité.","Brisons toute malédiction attachée à la terre et au travail de nos mains par le sang de Jésus (v. 17-19).","Prions pour que nous retrouvions l'accès à l'arbre de vie par Jésus-Christ (v. 22-24)."],"11":["Prions pour que nos offrandes soient agréées par Dieu, comme celle d'Abel (v. 4).","Prions pour donner à Dieu le meilleur, les prémices, et non les restes (v. 3-4).","Demandons pardon pour la jalousie et la colère cachées dans nos cœurs (v. 5-6).","Prions pour la grâce de dominer sur le péché qui se couche à notre porte (v. 7).","Brisons tout esprit de meurtre, de haine et de jalousie entre frères et sœurs, au nom de Jésus (v. 8).","Prions pour la grâce de veiller sur nos frères et d'en être les gardiens (v. 9).","Prions pour que le sang de Jésus parle en notre faveur, mieux que celui d'Abel.","Prions pour la paix et la réconciliation dans nos familles.","Rendons grâce à Dieu parce qu'il protège même le coupable par sa miséricorde (v. 15)."],"12":["Rendons grâce à Dieu parce qu'il protège l'enfant Jésus de la main d'Hérode (v. 13-14).","Prions pour la protection de nos enfants contre tout ennemi de leur destinée (v. 13).","Prions pour la grâce d'obéir immédiatement aux directives de Dieu, comme Joseph qui se leva de nuit (v. 14).","Brisons tout esprit d'Hérode qui cherche à tuer la vision et la destinée dans l'œuf (v. 16).","Prions pour les mères qui pleurent leurs enfants : que Dieu console les Rachel d'aujourd'hui (v. 18).","Prions pour les familles déplacées et réfugiées.","Prions pour que Dieu nous dise quand il est temps de rentrer et de nous établir (v. 19-21).","Prions pour la direction de Dieu dans nos déplacements et nos lieux de vie (v. 22-23).","Rendons grâce à Dieu parce que ses plans s'accomplissent malgré les menaces (v. 15, 23)."],"13":["Prions pour que la civilisation et le progrès ne nous éloignent pas de Dieu (v. 17-22).","Brisons tout esprit de vengeance et de violence, comme celui de Lémec, au nom de Jésus (v. 23-24).","Prions pour que Dieu suscite un « Seth » là où il y a eu perte et deuil (v. 25).","Rendons grâce à Dieu parce qu'il remplace ce qui a été perdu (v. 25).","Prions pour qu'on recommence à invoquer le nom de l'Éternel dans nos familles et dans notre nation (v. 26).","Prions pour que nos talents (musique, métiers, techniques) servent la gloire de Dieu (v. 20-22).","Prions pour un réveil de la prière dans notre génération (v. 26)."],"14":["Prions pour la grâce de marcher avec Dieu comme Hénoc (v. 22, 24).","Prions pour que notre marche avec Dieu ne soit pas d'un jour, mais de toute une vie (v. 22).","Prions pour qu'au milieu de la routine (naître, engendrer, mourir), notre vie laisse une trace pour Dieu (v. 21-24).","Rendons grâce à Dieu pour la vie éternelle : la mort n'a pas le dernier mot (v. 24).","Prions pour élever nos enfants dans la marche avec Dieu (v. 22).","Prions pour que nos familles soient connues comme des familles qui marchent avec Dieu.","Brisons l'esprit de mort prématurée sur nos lignées, au nom de Jésus (v. 5).","Prions pour que Dieu nous donne du soulagement dans la peine de notre travail, comme le nom de Noé l'annonçait (v. 29)."],"15":["Prions pour une vraie repentance dans nos vies, car le royaume des cieux est proche (v. 2).","Prions pour que nous préparions le chemin du Seigneur dans notre génération (v. 3).","Prions pour une vie simple et consacrée, comme celle de Jean-Baptiste (v. 4).","Demandons pardon pour nos péchés en les confessant ouvertement à Dieu (v. 6).","Prions pour produire des fruits dignes de la repentance (v. 8).","Brisons toute fausse sécurité religieuse : « Nous avons Abraham pour père » (v. 9).","Prions pour que la cognée soit mise à la racine de tout péché dans nos vies (v. 10).","Prions pour être baptisés du Saint-Esprit et de feu (v. 11).","Prions pour que Dieu purifie son aire : qu'il sépare en nous le bon grain de la paille (v. 12).","Prions pour l'humilité de Jean : « Je ne suis pas digne » (v. 11)."],"16":["Prions pour la sainteté des alliances et des mariages dans notre génération (v. 1-2).","Prions pour que l'Esprit de Dieu continue de lutter avec notre génération (v. 3).","Demandons pardon pour la méchanceté et les mauvaises pensées de nos cœurs (v. 5).","Prions pour que nos pensées soient tournées vers le bien (v. 5).","Prions pour que nous ne fassions pas de peine au cœur de Dieu (v. 6).","Prions pour trouver grâce aux yeux de l'Éternel, comme Noé (v. 8).","Prions pour notre nation : que Dieu y trouve des justes qui intercèdent.","Brisons toute corruption morale qui veut envahir nos familles et nos églises, au nom de Jésus."],"17":["Prions pour être justes et intègres au milieu d'une génération corrompue, comme Noé (v. 9).","Prions pour la grâce de marcher avec Dieu au quotidien (v. 9).","Prions pour recevoir de Dieu des instructions précises pour nos projets (v. 14-16).","Prions pour bâtir l'arche que Dieu nous demande, même quand personne ne comprend.","Rendons grâce à Dieu pour son alliance avec nous (v. 18).","Prions pour que toute notre famille entre dans l'arche du salut (v. 18).","Prions pour que Dieu pourvoie aux provisions nécessaires pour la saison à venir (v. 21).","Prions pour la grâce d'obéir exactement à tout ce que Dieu ordonne (v. 22).","Brisons toute violence et toute corruption qui remplissent la terre et nos villes, au nom de Jésus (v. 11-13)."],"18":["Rendons grâce à Dieu pour l'humilité de Jésus, qui s'est fait baptiser pour accomplir toute justice (v. 13-15).","Prions pour que nous accomplissions toute justice dans l'obéissance (v. 15).","Prions pour que les cieux s'ouvrent au-dessus de nos vies, de nos familles et de notre église (v. 16).","Prions pour que l'Esprit de Dieu descende sur nous comme une colombe (v. 16).","Prions pour entendre la voix du Père qui nous confirme notre identité de fils et de filles (v. 17).","Prions pour que nos vies plaisent à Dieu (v. 17).","Brisons tout doute sur notre identité en Christ, au nom de Jésus.","Prions pour les nouveaux convertis qui se préparent au baptême."],"19":["Rendons grâce à Dieu parce qu'il invite toute la maison de Noé à entrer dans l'arche (v. 1).","Prions pour que Dieu voie notre justice et protège notre maison (v. 1).","Prions pour la grâce d'obéir comme Noé, qui fit tout ce que Dieu lui avait ordonné (v. 5).","Rendons grâce à Dieu parce que lui-même ferma la porte de l'arche : il nous enferme dans sa protection (v. 16).","Prions pour que Dieu garde nos familles au-dessus des eaux de l'épreuve (v. 17-18).","Prions pour que nous restions dans l'arche du salut, en Jésus-Christ, jusqu'à la fin.","Prions pour le salut de ceux qui sont encore hors de l'arche dans nos familles.","Rendons grâce à Dieu parce qu'il préserve un reste fidèle (v. 23).","Prions pour la patience pendant les longues saisons d'attente (v. 24)."],"20":["Rendons grâce à Dieu parce qu'il se souvient de nous (v. 1).","Prions pour que Dieu fasse passer un vent sur nos situations et fasse baisser les eaux (v. 1).","Prions pour que notre arche s'arrête sur la montagne de Dieu (v. 4).","Prions pour la patience d'attendre le temps de Dieu (v. 6-12).","Prions pour recevoir des signes clairs que l'épreuve se termine (v. 11).","Prions pour sortir de l'arche au signal de Dieu et non avant (v. 15-16).","Prions pour une nouvelle saison de fécondité et de multiplication après l'épreuve (v. 17).","Rendons grâce à Dieu pour toutes les épreuves dont il nous a déjà fait sortir."],"21":["Prions pour que notre premier acte après la délivrance soit un autel pour Dieu (v. 20).","Prions pour que nos offrandes soient une odeur agréable devant Dieu (v. 21).","Rendons grâce à Dieu pour sa patience envers l'humanité (v. 21).","Rendons grâce à Dieu pour la fidélité des saisons : semailles et moissons, froid et chaleur, été et hiver (v. 22).","Prions pour que nos semailles produisent des moissons abondantes.","Prions pour de bonnes saisons de pluie et de récoltes dans notre pays (v. 22).","Prions pour la reconnaissance après chaque bénédiction."],"22":["Rendons grâce à Dieu parce que Jésus a vaincu le diable dans le désert (v. 1-11).","Prions pour que l'Esprit nous conduise, même dans les saisons de désert (v. 1).","Prions pour la grâce de jeûner et de prier selon la volonté de Dieu (v. 2).","Prions pour vivre de toute parole qui sort de la bouche de Dieu (v. 4).","Brisons toute tentation de chercher notre pain en dehors de la volonté de Dieu (v. 3-4).","Brisons toute tentation de mettre Dieu à l'épreuve et de chercher le spectaculaire (v. 5-7).","Brisons toute tentation de compromission pour obtenir les royaumes de ce monde (v. 8-9).","Prions pour adorer le Seigneur seul et le servir lui seul (v. 10).","Prions pour connaître la Parole au point de répondre à l'ennemi : « Il est écrit » (v. 4, 7, 10).","Prions pour que les anges de Dieu viennent nous servir après chaque victoire (v. 11)."],"23":["Rendons grâce à Dieu pour son alliance éternelle avec la terre et avec toute chair (v. 9-11).","Prions pour recevoir la bénédiction de fécondité et de multiplication (v. 1, 7).","Prions pour le respect de la vie humaine, créée à l'image de Dieu (v. 5-6).","Brisons toute effusion de sang et toute violence dans nos villes et notre nation, au nom de Jésus (v. 5-6).","Rendons grâce à Dieu pour l'arc-en-ciel, signe de sa fidélité (v. 13).","Prions pour que Dieu se souvienne de son alliance avec nous quand les nuages s'amoncellent (v. 14-15).","Prions pour que nous gardions nos alliances comme Dieu garde les siennes.","Rendons grâce à Dieu parce que les eaux du jugement ne nous détruiront pas (v. 15)."],"24":["Prions pour la grâce de rester vigilants après la victoire (v. 20-21).","Brisons tout esprit d'ivrognerie et de dépendance dans nos familles, au nom de Jésus (v. 21).","Prions pour que nous couvrions la honte de nos parents et de nos aînés au lieu de l'exposer (v. 22-23).","Demandons pardon pour les fois où nous avons exposé les fautes des autres (v. 22).","Prions pour que nos enfants honorent leurs parents (v. 23).","Prions pour recevoir la bénédiction de Sem : que l'Éternel soit notre Dieu (v. 26).","Prions pour que nos familles soient des tentes de bénédiction (v. 27)."],"25":["Prions pour que la lumière de Jésus se lève sur ceux qui sont assis dans les ténèbres (v. 16).","Prions pour prêcher la repentance comme Jésus : « Repentez-vous, car le royaume des cieux est proche » (v. 17).","Prions pour entendre l'appel de Jésus : « Suivez-moi » (v. 19).","Prions pour que Jésus fasse de nous des pêcheurs d'hommes (v. 19).","Prions pour la grâce de laisser aussitôt nos filets pour le suivre (v. 20, 22).","Prions pour que les familles entières suivent Jésus, comme les frères Pierre et André, Jacques et Jean (v. 18, 21).","Prions pour l'appel et la consécration de nouveaux ouvriers dans l'Église.","Brisons tout attachement qui nous empêche de suivre Jésus, au nom de Jésus."],"26":["Rendons grâce à Dieu parce que toutes les nations viennent de lui (v. 1, 32).","Prions pour que chaque peuple de la terre connaisse Dieu (v. 32).","Brisons tout esprit de Nimrod : l'orgueil, la puissance qui s'élève contre Dieu, au nom de Jésus (v. 8-10).","Prions pour que notre force soit employée à la gloire de Dieu et non à la nôtre (v. 8-9).","Prions pour l'unité et la paix entre les peuples et les ethnies de notre pays.","Prions pour les missions et l'évangélisation des peuples non atteints.","Prions pour que l'Afrique et le Cameroun accomplissent leur destinée en Dieu."],"27":["Brisons tout esprit d'orgueil qui veut se faire un nom sans Dieu, au nom de Jésus (v. 4).","Demandons pardon pour les projets bâtis pour notre propre gloire (v. 4).","Prions pour que Dieu descende et voie tout projet contraire à sa volonté (v. 5).","Prions pour que Dieu confonde le langage de ceux qui conspirent contre son peuple (v. 7).","Prions pour que notre unité serve la volonté de Dieu et non la rébellion (v. 6).","Prions pour bâtir uniquement ce que Dieu approuve.","Rendons grâce à Dieu parce que son plan s'accomplit malgré les projets des hommes (v. 8-9).","Prions pour que le Saint-Esprit renverse Babel et rassemble les peuples en Christ."],"28":["Rendons grâce à Dieu pour Jésus qui enseigne, prêche et guérit (v. 23).","Prions pour que l'Évangile du royaume soit prêché dans toutes nos villes (v. 23).","Prions pour la guérison de toute maladie et de toute infirmité parmi nous (v. 23).","Prions pour les malades de nos familles et de notre église (v. 24).","Brisons toute oppression démoniaque, toute épilepsie et toute paralysie, au nom de Jésus (v. 24).","Prions pour que la renommée de Jésus se répande dans notre région (v. 24).","Prions pour que les foules viennent à Jésus (v. 25)."],"29":["Rendons grâce à Dieu parce qu'il suit le fil de ses promesses à travers les générations (v. 10-26).","Prions pour la grâce de quitter ce qui doit être quitté pour obéir à Dieu (v. 31).","Prions pour celles qui sont stériles, comme Saraï, et pour l'accomplissement des promesses de Dieu (v. 30).","Prions pour ne pas nous arrêter à mi-chemin, comme Térach à Charan (v. 31-32).","Prions pour achever le voyage que Dieu nous a assigné.","Brisons tout esprit de deuil et de perte qui freine notre marche (v. 28, 32).","Prions pour les familles qui traversent le deuil."],"30":["Prions pour entendre l'appel de Dieu et sortir comme Abram (v. 1).","Prions pour la grâce de quitter ce que Dieu nous demande de quitter : lieu, habitudes, relations (v. 1).","Prions pour recevoir la bénédiction d'Abram : que Dieu fasse de nous une grande nation et rende notre nom grand (v. 2).","Prions pour devenir une source de bénédiction pour les autres (v. 2).","Prions pour que Dieu bénisse ceux qui nous bénissent (v. 3).","Prions pour que toutes les familles de la terre soient bénies en Christ, la postérité d'Abraham (v. 3).","Prions pour l'obéissance immédiate, même à 75 ans (v. 4).","Prions pour bâtir un autel à Dieu partout où nous passons (v. 7-8).","Rendons grâce à Dieu pour les promesses qu'il fait à notre descendance (v. 7)."],"31":["Demandons pardon pour les fois où la peur nous a poussés au mensonge (v. 11-13).","Prions pour la grâce de faire confiance à Dieu dans la famine et la crise (v. 10).","Prions pour la protection des épouses contre tout abus et toute convoitise (v. 14-15).","Rendons grâce à Dieu parce qu'il protège ses promesses même quand nous échouons (v. 17).","Prions pour que Dieu frappe et arrête tout projet de prendre ce qui nous appartient (v. 17).","Prions pour sortir des Égyptes où nous nous sommes égarés (v. 20).","Prions pour l'intégrité et la vérité dans nos paroles."],"32":["Prions pour la pauvreté en esprit qui ouvre le royaume des cieux (v. 3).","Prions pour que Dieu console ceux qui pleurent dans nos familles et notre église (v. 4).","Prions pour la douceur qui hérite la terre (v. 5).","Prions pour avoir faim et soif de la justice (v. 6).","Prions pour avoir un cœur misé <script>
"use strict";
const ic=n=>'<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const BASE=JSON.parse(document.getElementById('base').textContent);
const BOOKS=BASE.books, S=BASE.S, SP=BASE.SP, TOTAL=S.length;

const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const frDate=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return d+'/'+m+'/'+y;};

/* ---------- données ---------- */
function sess(n){const r=S[n-1],o=OV[n]||{};return{n,t:r[0],book:BOOKS[r[1]],bi:r[1],ref:r[2],theme:o.theme||r[3],theme0:r[3],nv:r[4],keys:o.keys||r[5],keys0:r[5],k:r[6]};}
function subjects(n){const o=OV[n];if(o&&Array.isArray(o.subj))return o.subj;return (SP[n]||[]).map(t=>({t,p:false,s:'base'}));}
const isDone=n=>!!(OV[n]&&OV[n].done);
function counts(){let d=0,da=0,dn=0,sj=0,pr=0;for(let n=1;n<=TOTAL;n++){if(isDone(n)){d++;S[n-1][0]?dn++:da++;}const L=subjects(n);sj+=L.length;pr+=L.filter(x=>x.p).length;}return{d,da,dn,sj,pr};}
function nextUndone(k){const out=[];for(let n=1;n<=TOTAL&&out.length<k;n++)if(!isDone(n))out.push(n);return out;}

function loadLocal(){try{const o=JSON.parse(localStorage.getItem('medit-ov')||'{}');OV=o.OV||{};CFG=Object.assign(CFG,o.CFG||{});}catch(e){}}
function saveLocal(){try{localStorage.setItem('medit-ov',JSON.stringify({OV,CFG}));}catch(e){}}

async function saveSess(n,patch){
  if(!canWrite){toast("Vous pouvez consulter ce programme, mais pas le modifier.");return;}
  const cur=Object.assign({},OV[n]||{});
  if(patch.subj===undefined && !cur.subj && SP[n]) cur.subj=subjects(n);
  const next=Object.assign(cur,patch);
  OV[n]=next;render();
  if(mode==='db'){try{await db.doc('seances/'+n).set(next);}catch(e){toast("Enregistrement refusé : "+(e&&e.code||'erreur'));}}
  else saveLocal();
}
async function deleteSess(n){
  delete OV[n];render();
  if(mode==='db'){try{await db.doc('seances/'+n).delete();}catch(e){toast("Échec : "+(e&&e.code||'erreur'));}}else saveLocal();
}
async function saveCfg(patch){
  CFG=Object.assign({},CFG,patch);render();
  if(mode==='db'){try{await db.doc('config/main').set(CFG);}catch(e){toast("Réglage non enregistré");}}else saveLocal();
}

/* ---------- rendu ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200);}
function header(){
  const c=counts();
  $('#hdrSub').textContent=c.d+' séance'+(c.d>1?'s':'')+' faite'+(c.d>1?'s':'')+' sur '+TOTAL+' · '+c.sj+' sujets de prière';

}
function render(){

}

  }

const cleanSubj=t=>String(t).replace(/^\s*(?:[-•*–·▪●]|\(?\d{1,3}[.)°-])\s*/,'').replace(/\s+/g,' ').trim();
const HEAD=/^\s*(?:#|s[ée]ance\s*(?:n[°o.]?\s*)?|n[°o]\s*)(\d{1,4})\b/i;
const SKIP=/^\s*(th[èe]me|[àa] m[ée]diter|lire|passage|notes?|versets?|livret|programme|date)\s*:/i;
function parseText(txt,tgt){
  const rows=[];let cur=tgt||null,miss=0;
  txt.split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;
    const m=line.match(HEAD);
    if(m){const v=+m[1];if(v>=1&&v<=TOTAL){cur=v;return;}}
    if(SKIP.test(line))return;
    const t=cleanSubj(line);if(t.length<4)return;
    if(!cur){miss++;return;}
    rows.push({n:cur,t,on:true});
  });
  return{rows,miss};
}
function parseSheet(aoa,tgt){
  let hr=-1,cn=-1,ct=-1;
  for(let r=0;r<Math.min(15,aoa.length)&&hr<0;r++){const row=aoa[r].map(x=>String(x).toLowerCase());
    row.forEach((c,i)=>{if(cn<0&&/s[ée]ance|^n°$|^no$/.test(c))cn=i;if(ct<0&&/sujet|pri[èe]re/.test(c)&&!/n°\s*sujet|^n° sujet/.test(c)&&!/s[ée]ance/.test(c))ct=i;});
    if(ct>=0)hr=r;else{cn=-1;}}
  const rows=[];let miss=0;
  if(hr>=0){for(let r=hr+1;r<aoa.length;r++){const row=aoa[r];const t=cleanSubj(row[ct]||'');if(t.length<4)continue;let n=cn>=0?parseInt(row[cn],10):tgt;if(!(n>=1&&n<=TOTAL))n=tgt;if(!n){miss++;continue;}rows.push({n,t,on:true});}}
  else{aoa.forEach(row=>{const cells=row.map(x=>String(x).trim()).filter(Boolean);if(!cells.length)return;let n=tgt,t;
    if(cells.length>=2&&/^\d{1,4}$/.test(cells[0])&&+cells[0]<=TOTAL){n=+cells[0];t=cells.slice(1).sort((a,b)=>b.length-a.length)[0];}else t=cells.sort((a,b)=>b.length-a.length)[0];
    t=cleanSubj(t);if(t.length<4)return;if(!n){miss++;return;}rows.push({n,t,on:true});});}
  return{rows,miss};
}
async function handleFile(file){
  const tgt=parseInt(($('#tgt')||{}).value,10)||null;const name=file.name;const ext=name.split('.').pop().toLowerCase();
  try{
    let res;
    if(ext==='json'){const o=JSON.parse(await file.text());if(!o||!o.OV)throw new Error("Ce fichier JSON n'est pas une sauvegarde du programme.");UI.imp={backup:o,name,tgt};render();return;}
    if(ext==='docx'){if(!window.mammoth)throw new Error("Le lecteur Word n'a pas pu être chargé. Vérifiez la connexion puis rechargez la page.");const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});res=parseText(r.value,tgt);}
    else if(ext==='txt'){res=parseText(await file.text(),tgt);}
    else{if(!window.XLSX)throw new Error("Le lecteur Excel n'a pas pu être chargé. Vérifiez la connexion puis rechargez la page.");const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});

    UI.imp={rows:res.rows,miss:res.miss,name,mode:'add',dup:true,tgt};render();
  }catch(e){toast(e.message||"Lecture du fichier impossible.");}
}

const STREAMS={
  bible:[['Loi',range(0,4)],['Livres historiques',range(5,16)],['Psaumes',[18]],['Poésie et sagesse',[17,19,20,21]],['Prophètes',range(22,38)],['Évangiles et Actes',range(39,43)],['Épîtres et Apocalypse',range(44,65)]],

};

const ORDRE={canon:'Ordre des livres',chrono:'Chronologique',alt:'Alterné AT + NT chaque jour',parties:'Par grandes parties (rotation)'};
function chapsOfBooks(bs){const out=[];bs.forEach(b=>{for(let c=1;c<=VC[b].length;c++)out.push([b,c]);});return out;}
function chronoChaps(scope){const seg=scope==='nt'?CH.slice(NCHOT):scope==='at'?CH.slice(0,NCHOT):CH;const out=[];seg.forEach(([b,a,z])=>{for(let c=a;c<=z;c++)out.push([b,c]);});return out;}
function buildStream(chaps,D){
  let total=0;chaps.forEach(([b,c])=>total+=VC[b][c-1]);const T=total/D;let U=[];
  chaps.forEach(([b,c])=>{const v=VC[b][c-1];const p=v>1.5*T?Math.max(1,Math.round(v/T)):1;let a=1;for(let k=0;k<p;k++){const z=k===p-1?v:Math.round(v*(k+1)/p);U.push({b,c,a,z,v:z-a+1});a=z+1;}});
  while(U.length<D){let mi=0;U.forEach((u,i)=>{if(u.v>U[mi].v)mi=i;});const u=U[mi];if(u.v<2)break;const m=u.a+Math.floor(u.v/2)-1;U.splice(mi,1,{b:u.b,c:u.c,a:u.a,z:m,v:m-u.a+1},{b:u.b,c:u.c,a:m+1,z:u.z,v:u.z-m});}
  const days=[];let i=0,cum=0;
  for(let j=0;j<D;j++){const day=[];const target=total*(j+1)/D;
    while(i<U.length){const left=U.length-i,dleft=D-j;if(j===D-1||(day.length&&(left<=dleft-1||cum+U[i].v/2>target)))break;day.push(U[i]);cum+=U[i].v;i++;}
    if(j===D-1)while(i<U.length){day.push(U[i]);cum+=U[i].v;i++;}
    days.push(day);}
  return days;
}
function fmtUnits(us){
  const R=[];us.forEach(u=>{const L=R[R.length-1];
    if(L&&L.b===u.b&&((u.c===L.c2&&u.a===L.v2+1)||(u.c===L.c2+1&&u.a===1&&L.v2===VC[u.b][L.c2-1]))){L.c2=u.c;L.v2=u.z;}else R.push({b:u.b,c1:u.c,v1:u.a,c2:u.c,v2:u.z});});
  return R.map(r=>{const full=r.v1===1&&r.v2===VC[r.b][r.c2-1];let nm=BOOKS[r.b];if(r.b===18)nm=(full&&r.c1!==r.c2)?'Psaumes':'Psaume';
    if(full)return nm+' '+(r.c1===r.c2?r.c1:r.c1+'-'+r.c2);
    return r.c1===r.c2?nm+' '+r.c1+':'+r.v1+'-'+r.v2:nm+' '+r.c1+':'+r.v1+' – '+r.c2+':'+r.v2;}).join(' ; ');

function readings(p){
  const key=p.portee+'|'+p.ordre+'|'+p.ans;if(RCACHE[key])return RCACHE[key];
  const D=365*(+p.ans||1);let out=[];
  const one=chaps=>buildStream(chaps,D).map(d=>[{l:'',t:fmtUnits(d),v:d.reduce((s,u)=>s+u.v,0),u:d}]);
  if(p.ordre==='chrono')out=one(chronoChaps(p.portee));
  else if(p.ordre==='alt'){const a=buildStream(chapsOfBooks(range(0,38)),D),b=buildStream(chapsOfBooks(range(39,65)),D);out=a.map((d,i)=>[{l:'AT',t:fmtUnits(d),v:d.reduce((s,u)=>s+u.v,0),u:d},{l:'NT',t:fmtUnits(b[i]),v:b[i].reduce((s,u)=>s+u.v,0),u:b[i]}]);}
  else if(p.ordre==='parties'){const st=STREAMS[p.portee],k=st.length;const S2=st.map((s,si)=>buildStream(chapsOfBooks(s[1]),Math.floor((D-1-si)/k)+1));
    for(let d=0;d<D;d++){const si=d%k,day=S2[si][Math.floor(d/k)];out.push([{l:st[si][0],t:fmtUnits(day),v:day.reduce((s,u)=>s+u.v,0),u:day}]);}}
  else out=one(chapsOfBooks(p.portee==='nt'?range(39,65):p.portee==='at'?range(0,38):range(0,65)));

const addDays=(iso,n)=>{const [y,m,d]=iso.split('-').map(Number);const t=new Date(Date.UTC(y,m-1,d+n));return t.toISOString().slice(0,10);};
const diffDays=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
const localISO=iso=>{const d=new Date(iso);if(isNaN(d))return String(iso).slice(0,10);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const frDT=iso=>{if(!iso)return '';const d=new Date(iso);if(isNaN(d))return frDate(iso.slice(0,10));return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});};

function schedule(p){
  const R=readings(p),done=p.done||{},days=[];
  if(!p.recal){R.forEach((r,i)=>days.push({date:addDays(p.start,i),idx:[i]}));}
  else{const und=[];R.forEach((r,i)=>{if(done[i]){const o=addDays(p.start,i);days.push({date:o<p.recal.from?o:localISO(done[i]),idx:[i]});}else und.push(i);});
    const k=und.length,from=p.recal.from;
    if(p.recal.mode==='catchup'&&p.recal.end){const m=diffDays(from,p.recal.end)+1;if(m>0&&m<k){for(let j=0;j<m;j++)days.push({date:addDays(from,j),idx:und.slice(Math.floor(j*k/m),Math.floor((j+1)*k/m))});}else und.forEach((i,j)=>days.push({date:addDays(from,j),idx:[i]}));}
    else und.forEach((i,j)=>days.push({date:addDays(from,j),idx:[i]}));
    days.sort((a,b)=>a.date.localeCompare(b.date)||a.idx[0]-b.idx[0]);}

function planStats(p){const R=readings(p),S2=schedule(p),td=todayISO(),done=p.done||{};

const SKIPT=new Set(['f','x','fe','note','rem','h','s','s1','s2','s3','toc','toc1','toc2','toc3','id','ide','cl','title','ms','mt','mt1','mt2','mt3','d','r','fig','rdg','reference','catchword','sp','information','caption']);
function emptyBooks(){return Array.from({length:66},()=>[]);}
function put(B,b,c,v,t){if(!(b>=0&&b<66)||!(c>0)||!(v>0))return;const ch=B[b][c-1]||(B[b][c-1]=[]);t=String(t).replace(/\s+/g,' ').trim();if(!t)return;ch[v-1]=ch[v-1]?ch[v-1]+' '+t:t;}

function parseVPL(txt){const B=emptyBooks();let n=0;txt.split(/\r?\n/).forEach(l=>{const m=l.match(/^\s*([1-3]?\s?[A-Za-z]{2,6})\.?\s+(\d+)[:.,](\d+)[a-z]?\s+(.*)$/);if(!m)return;const b=codeIdx(m[1]);if(b<0)return;put(B,b,+m[2],+m[3],m[4]);n++;});return n?B:null;}
function parseZef(doc){const B=emptyBooks();for(const bk of doc.getElementsByTagName('BIBLEBOOK')){const b=+bk.getAttribute('bnumber')-1;for(const ch of bk.getElementsByTagName('CHAPTER')){const c=+ch.getAttribute('cnumber');for(const v of ch.getElementsByTagName('VERS'))put(B,b,c,+v.getAttribute('vnumber'),textOf(v));}}return B;}
function parseOSIS(doc){const B=emptyBooks(),vs=doc.getElementsByTagName('verse');let mile=false;for(const v of vs){if(v.getAttribute('sID')||v.getAttribute('eID')){mile=true;break;}}
  const idp=v=>(v.getAttribute('osisID')||'').split(' ')[0].split('.');
  if(!mile){for(const v of vs){const id=idp(v);if(id.length>=3)put(B,codeIdx(id[0]),+id[1],+id[2],textOf(v));}return B;}
  let cur=null;(function w(n){for(const k of n.childNodes){if(k.nodeType===3){if(cur)cur.t+=k.nodeValue;continue;}if(k.nodeType!==1)continue;const nm=k.nodeName.toLowerCase();
    if(nm==='verse'){if(k.getAttribute('sID')){const id=idp(k);cur={b:codeIdx(id[0]),c:+id[1],v:+id[2],t:''};}else if(k.getAttribute('eID')){if(cur)put(B,cur.b,cur.c,cur.v,cur.t);cur=null;}else w(k);}
    else if(!SKIPT.has(nm))w(k);}})(doc.documentElement);return B;}
function parseUSFX(doc){const B=emptyBooks();let b=-1,c=0,cur=null;const fl=()=>{if(cur){put(B,b,c,cur.v,cur.t);cur=null;}};
  (function w(n){for(const k of n.childNodes){if(k.nodeType===3){if(cur)cur.t+=k.nodeValue;continue;}if(k.nodeType!==1)continue;const nm=k.nodeName.toLowerCase();
    if(nm==='book'){fl();b=codeIdx(k.getAttribute('id'));c=0;w(k);fl();}else if(nm==='c'){fl();c=+k.getAttribute('id');}else if(nm==='v'){fl();cur={v:parseInt(k.getAttribute('id'),10),t:''};}else if(nm==='ve'){fl();}else if(!SKIPT.has(nm))w(k);}})(doc.documentElement);fl();return B;}
function parseXMLBible(txt){const doc=new DOMParser().parseFromString(txt,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error("Ce fichier XML est illisible.");
  if(doc.getElementsByTagName('BIBLEBOOK').length)return{B:parseZef(doc),title:(doc.getElementsByTagName('title')[0]||{}).textContent};
  if(doc.getElementsByTagName('verse').length)return{B:parseOSIS(doc),title:(doc.getElementsByTagName('title')[0]||{}).textContent};

function parseJSONBible(txt){const o=JSON.parse(txt);if(o&&o.app==='medit-bible'&&o.books)return{B:o.books,title:o.nom,abbr:o.abbr};

  if(Array.isArray(arr)&&arr.length>=27){const B=emptyBooks(),off=arr.length===27?39:0;arr.forEach((bk,i)=>{const chs=Array.isArray(bk)?bk:(bk.chapters||bk.Chapters||bk.chapitres);if(!Array.isArray(chs))return;
    chs.forEach((ch,ci)=>{const vs=Array.isArray(ch)?ch:(ch.verses||ch.Verses||ch.versets||[]);vs.forEach((v,vi)=>{const t=typeof v==='string'?v:(v&&(v.text||v.Text||v.texte))||'';const vn=v&&typeof v==='object'&&(v.verse||v.Verse||v.number||v.numero)?+(v.verse||v.Verse||v.number||v.numero):vi+1;put(B,i+off,ci+1,vn,t);});});});return{B,title:o.name||o.nom||''};}

  if(ext==='zip'){if(!window.JSZip)throw new Error("Le module ZIP n'a pas pu être chargé.");const z=await JSZip.loadAsync(await file.arrayBuffer());const ents=Object.values(z.files).filter(f=>!f.dir);

    case 'lsubsave':{const s=lNotes(p,i).s.slice(),t=$('#les-'+i+'-'+j).value.trim();UI.ledit=null;if(t)s[j]=Object.assign({},s[j],{t});setLNotes(i,{s});return true;}
    case 'lsubdel':{const s=lNotes(p,i).s.slice();s.splice(j,1);setLNotes(i,{s});return true;}
    case 'lai':{const r=readings(p)[i];aiRun('L'+i,r.map(x=>x.t).join(' ; '),'','',lNotes(p,i).s.map(x=>x.t));return true;}
    case 'laiclose':delete UI.ai['L'+i];render();return true;
    case 'laiadd':{const a2=UI.ai['L'+i],s=lNotes(p,i).s.slice();document.querySelectorAll('[data-aibox="L'+i+'"] [data-ai]').forEach(cb=>{if(cb.checked)s.push({t:a2.items[+cb.dataset.ai],p:false,s:'ia'});});delete UI.ai['L'+i];setLNotes(i,{s});return true;}

}

/* ---------- Claude ---------- */
async function askClaude(n){
  const s=sess(n),cur=subjects(n).map(x=>x.t);UI.ai[n]={loading:true};render();
  const prompt='Tu aides un chrétien francophone du Cameroun à méditer la Bible (version Louis Segond 1910).\n'+
  'Passage : '+s.ref+'\nThème du texte : '+s.theme+'\nVersets à méditer : '+s.keys+'\n\n'+
  'Rédige 10 sujets de prière tirés précisément de ce passage, en particulier des versets à méditer.\n'+
  'Règles :\n- Chaque sujet commence par un verbe à l\'impératif à la première personne du pluriel : « Prions pour… », « Prions pour que… », « Rendons grâce à Dieu parce que… », « Adorons… », « Brisons… », « Demandons pardon pour… ».\n- N\'emploie jamais « Déclarons », « Soyons » ni « Écrivons ».\n- Termine chaque sujet par la référence du verset entre parenthèses, par exemple (v. 3).\n- Varie les types : adoration, action de grâce, repentance, promesse à saisir, obéissance, combat spirituel, intercession pour la famille, l\'Église et la nation.\n- Une phrase par sujet, claire et concrète.\n'+
  (cur.length?'- Ne répète pas ces sujets déjà présents :\n'+cur.map(t=>'  • '+t).join('\n')+'\n':'')+
  '\nRéponds uniquement par un tableau JSON de chaînes de caractères.';
  try{
    const out=await sampleFn.json(prompt,{modelTier:'default',cache:false});
    const items=(Array.isArray(out)?out:[]).map(x=>typeof x==='string'?x:(x&&(x.sujet||x.text))||'').map(t=>t.trim()).filter(t=>t.length>5).filter(t=>!/^(D[ée]clarons|Soyons|[ÉE]crivons)\b/.test(t));
    UI.ai[n]=items.length?{items}:{err:"Claude n'a pas renvoyé de sujets exploitables. Réessayez."};
  }catch(e){
    UI.ai[n]={err:e&&e.code==='not_granted'?"L'accès à Claude n'a pas été autorisé pour cette page.":e&&e.code==='rate_limited'?"Trop de demandes rapprochées. Patientez une minute puis réessayez.":"La demande à Claude a échoué. Réessayez plus tard."};
    if(e&&e.code==='not_granted')sampleFn=null;
  }
  render();
}

function tCommit(withToast){clearTimeout(tTimer);const t=UI.tdraft;if(!t)return;
  const empty=!t.titre.trim()&&!tWords(t)&&!t.ref.trim();if(empty&&!TEACH[t.id])return;

  if(typeof enqueue==='function')enqueue('saveTeach',[t.id],'T'+t.id);
  if(withToast)toast('Enseignement enregistré');
  const s=document.querySelector('.tedit + .card .muted');if(s)s.textContent='Enregistré '+shortDT(t.maj)+' par '+t.par+' · '+tWords(t)+' mots';}

/* ----- dictée ----- */
let REC=null;
function tStopMic(){if(REC){try{REC.onend=null;REC.stop();}catch(e){}REC=null;}UI.tmic=null;}
function tStartMic(field){
  if(!SR){toast("La dictée n'est pas disponible ici : utilisez le micro du clavier de votre téléphone.");return;}
  if(!navigator.onLine)toast('Sans réseau, la dictée peut ne pas fonctionner : utilisez le micro du clavier.');
  tStopMic();UI.tmic=field;render();

  QUEUE=(await IDB.get('queue'))||[];Object.assign(SYNC,(await IDB.get('sync'))||{});if(FROM_GOOGLE&&(SYNC.url!==API_URL||SYNC.key!==API_KEY)){SYNC.url=API_URL;SYNC.key=API_KEY;if(!SYNC.name)SYNC.name='Page Google';await IDB.set('sync',SYNC);}
  render();refreshLocalBibles();updSync();if(SYNC.url)pull();
})();
window.addEventListener('online',()=>pull());window.addEventListener('offline',updSync);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastPull>60000)pull();});

  if(navigator.onLine&&(CONN.ok===false||SYNCERR||/\/dev$/.test(SYNC.url))){const det=CONN.err||SYNCERR||"l'adresse finit par /dev";
    h+='<div class="card errcard"><div class="eh">⚠️ <b>Pas de connexion au serveur</b></div><p>Vos changements restent enregistrés sur cet appareil et partiront dès que la connexion reviendra.</p><p class="edet">Détail : '+esc(det)+'</p>'+
    '<details><summary>Que vérifier ?</summary><ol><li>Dans <b>Réglages</b>, l\'adresse finit bien par <b>/exec</b> (jamais /dev). Prenez-la dans le classeur : menu <b>Méditation › Liens d\'installation</b>.</li><li>Le code secret est le même que dans le classeur.</li><li>Apps Script › Déployer › Gérer les déploiements : un seul déploiement « Application Web », <b>Exécuter en tant que : Moi</b>, <b>Qui a accès : Tout le monde</b>.</li><li>Après une modification du code : <b>crayon › Nouvelle version</b>.</li></ol></details>'+
    '<div class="row" style="gap:8px"><button class="btn primary" data-act="snow">🔄 Réessayer</button><button class="btn" data-act="gotoset">Ouvrir les Réglages</button></div></div>';}
  if(FUSEAU)h+='<div class="card warncard">🕒 <b>Fuseau horaire à régler</b><p>'+esc(FUSEAU)+'</p></div>';
  return h;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act="gotoset"]');if(!b)return;e.preventDefault();UI.tab='set';render();window.scrollTo(0,0);});
